<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z-Horror Loading</title>
<style>
  @font-face{
    font-family:'HeadUpDaisy';
    src:url('fonts/headupdaisy.ttf') format('truetype');
    font-display:swap;
  }
  :root{
    --void:#030303;
    --red:#e0233c;
    --green:#3ba55d;
    --discord:#5865F2;
    --ink:#efe9e9;
    --ink-dim:#b3a3a3;
    --ink-faint:#7a6a6a;
    --font-pixel:'HeadUpDaisy',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);color:var(--ink);font-family:var(--font-pixel);overflow:hidden}

  .bgshot{
    position:fixed;inset:0;
    background-image:url('background.jpg');
    background-size:cover;background-position:center;
    filter:grayscale(.3) contrast(1.05) brightness(.72);
    transform:scale(1.03);
  }
  .bgshot::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(3,3,3,.32) 0%, rgba(3,3,3,.12) 45%, rgba(3,3,3,.82) 100%),
      radial-gradient(ellipse 1100px 800px at 50% 50%, rgba(224,35,60,.06) 0%, transparent 65%);
  }
  .noise{
    position:fixed;inset:0;opacity:.04;pointer-events:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence baseFrequency="0.85" numOctaves="2"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }
  .vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.45)}

  #topright{position:fixed;top:22px;right:26px;z-index:10;text-align:right;max-width:380px}
  #tip{margin-bottom:16px}
  #tip .lbl{font-size:14px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;margin-bottom:6px}
  #tip p{margin:0;font-size:17px;color:var(--ink-dim);line-height:1.5}

  #ds{
    display:inline-flex;align-items:center;gap:12px;text-decoration:none;
    background:rgba(18,15,16,.82);border:1px solid rgba(255,255,255,.08);
    border-radius:10px;padding:10px 16px;backdrop-filter:blur(6px);
    transition:border-color .2s,background .2s;
  }
  #ds:hover{border-color:rgba(88,101,242,.5);background:rgba(24,18,19,.9)}
  #ds .icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
  #ds .icon img{width:100%;height:100%;object-fit:cover}
  #ds .txt{text-align:left}
  #ds .link{color:var(--ink);font-size:15px;font-weight:600;letter-spacing:.02em;display:block}
  #ds .stats{color:var(--ink-dim);font-size:12px;letter-spacing:.02em;margin-top:2px;display:flex;align-items:center;gap:6px}
  #ds .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);flex-shrink:0}

  .center{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;width:min(900px,94vw);
  }
  .eyebrow{
    font-size:16px;letter-spacing:.25em;
    color:var(--ink-dim);text-transform:uppercase;margin-bottom:34px;
  }
  .eyebrow::before{content:"— "}
  .eyebrow::after{content:" —"}

  .logo-img{
    display:block;margin:0 auto;max-width:640px;width:82%;height:auto;
  }
  .logo-fallback{
    font-weight:700;font-size:78px;letter-spacing:6px;line-height:.95;
    color:#f2ecec;
  }

  .tagline{
    margin-top:34px;font-size:18px;
    letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase;
  }

  .pills{display:flex;gap:26px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .pill{color:var(--ink-dim);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
  .pill::after{content:"";display:block;width:0;height:1px;background:var(--red);margin-top:5px;transition:width .3s}

  #loadbox{width:340px;margin:26px auto 0}
  .bar{height:4px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;margin-bottom:8px}
  #fill{height:100%;width:0;background:linear-gradient(90deg,transparent,var(--red));box-shadow:0 0 8px rgba(224,35,60,.7);transition:width .25s ease}
  #status{font-size:14px;color:var(--ink-faint);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #filelist{margin-top:3px;font-size:12px;color:var(--ink-faint);opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #tag{position:fixed;left:26px;bottom:20px;z-index:10;font-size:16px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase}
  #tag .red{color:var(--red)}
</style>
</head>
<body>

<div class="bgshot"></div>
<div class="noise"></div>
<div class="vig"></div>

<div id="topright">
  <div id="tip">
    <div class="lbl">Совет игроку</div>
    <p id="tiptext">Такая вешь существет фонарик слышал о таком нет?</p>
  </div>
  <a id="ds" href="https://discord.gg/s5bYAQ3zWx" target="_blank" title="Discord">
    <span class="icon">
      <img src="images.png" alt="Discord">
    </span>
    <span class="txt">
      <span class="link">discord.gg/s5bYAQ3zWx</span>
      <span class="stats"><span class="dot"></span><span id="dcount">загрузка...</span></span>
    </span>
  </a>
</div>

<div class="center">
  <div class="eyebrow">Первый хоррор сервер на базе ZCity</div>

  <img class="logo-img" src="logo.png" alt="Z-HORROR"
       onerror="this.style.display='none';document.getElementById('logofallback').style.display='block'">
  <div class="logo-fallback" id="logofallback" style="display:none">Z-HORROR</div>

  <div class="tagline">Минотавр идет за тобой ожидай</div>

  <div class="pills">
    <span class="pill">Garry's Mod</span>
    <span class="pill">Horror</span>
    <span class="pill">ZCity</span>
    <span class="pill">Survival</span>
  </div>

  <div id="loadbox">
    <div class="bar"><div id="fill"></div></div>
    <div id="status">Подключение...</div>
    <div id="filelist"></div>
  </div>
</div>

<div id="tag">Z-HORROR <span class="red">//</span> ZCITY</div>

<audio id="bgm" autoplay loop preload="auto">
  <source src="bgm.mp3" type="audio/mpeg">
  <source src="mainmenu.mp3" type="audio/mpeg">
</audio>

<script>
function GameDetails(n,u,m,mp,sid,gm){}

const bgm=document.getElementById('bgm');
bgm.volume=0.35;
bgm.play().catch(() => {
  const start = () => bgm.play().catch(() => {});
  document.addEventListener('click', start, { once: true });
  document.addEventListener('keydown', start, { once: true });
  document.addEventListener('touchstart', start, { once: true });
});

let need=0,total=0;
function updateProgress(){
  let p=total>0?Math.round((total-need)/total*100):0;
  if(p<0)p=0; if(p>100)p=100;
  document.getElementById('fill').style.width=p+"%";
}
function SetFilesNeeded(n){need=n;updateProgress();}
function SetFilesTotal(n){total=n;updateProgress();}
function DownloadingFile(f){
  document.getElementById('status').textContent="Качаю: "+f;
  document.getElementById('filelist').textContent=f;
  updateProgress();
}
function SetStatusChanged(s){
  document.getElementById('status').textContent=s;
  const m=s.match(/(\d+)%/);
  if(m) document.getElementById('fill').style.width=m[1]+"%";
  if(s.indexOf("Sending client info")>-1||s.indexOf("Workshop Complete")>-1)
    document.getElementById('fill').style.width="100%";
}

fetch("https://discord.com/api/invites/s5bYAQ3zWx?with_counts=true")
  .then(r=>r.json())
  .then(d=>{
    if(d && typeof d.approximate_presence_count==="number" && typeof d.approximate_member_count==="number"){
      document.getElementById('dcount').textContent=d.approximate_presence_count+" онлайн • "+d.approximate_member_count+" участников";
    } else {
      document.getElementById('dcount').textContent="Присоединиться";
    }
  })
  .catch(()=>{document.getElementById('dcount').textContent="Присоединиться";});

const tips=[
  "Заходи для приличия в дискорд и или в настройки что бы сделать бинды киллеров.",
  "Ты прикнь нужно не пиздиться а действовать вместе.",
  "Смерть в нищите покупай Division pack что бы заходить без очереди.",
  "Пиши в предложку а не Игнатику.",
  "Ивенты вообще будут нет?",
  "Правила кстати еще есть в дискорде ты давай читай не нарушай понял?",
  "У тебя слух есть если что слушай когда к тебе бежит бон бон."
];
let ti=0;
setInterval(()=>{ti=(ti+1)%tips.length;document.getElementById('tiptext').textContent=tips[ti];},6000);
</script>
</body>
</html>
